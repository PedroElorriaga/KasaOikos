# CI: roda em todo push e PR. A `main` só aceita merge com os 3 jobs verdes (ruleset no GitHub).
# Actions fixadas por SHA de commit (a tag fica no comentário); o Dependabot atualiza as duas.
name: CI

on:
  push:
  pull_request:

# Padrão: token só de leitura. Cada job pede o que precisar a mais.
permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Lint (ruff)
        run: uv run --locked ruff check .
      - name: Formatação (ruff format)
        run: uv run --locked ruff format --check .
      - name: Tipos (mypy)
        run: uv run --locked mypy
      # Os testes de integração sobem um Postgres real (testcontainers) no Docker do runner.
      - name: Testes (pytest)
        run: uv run --locked pytest

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Versão do pnpm vem do campo `packageManager` do package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Dependências
        run: pnpm install --frozen-lockfile
      - name: Lint, formatação, tipos e testes
        run: pnpm check
      - name: Build
        run: pnpm build

  seguranca:
    name: seguranca
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # envio dos resultados do CodeQL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo para o gitleaks
          persist-credentials: false

      # Mesma versão do hook do pre-commit. Binário oficial com checksum conferido.
      - name: Segredos no histórico (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$arquivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$arquivo"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$arquivo" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$arquivo" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Audita exatamente o que está no uv.lock (inclusive dev), com hashes, sem instalar nada.
      - name: Vulnerabilidades no back-end (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --all-groups --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vulnerabilidades no front-end (pnpm audit)
        working-directory: frontend
        run: pnpm audit --audit-level=high

      - name: CodeQL (preparação)
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python, javascript-typescript
          build-mode: none
      - name: CodeQL (análise)
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
