# Atualizações semanais de dependências. Cada ecossistema abre um PR agrupado com as
# atualizações minor/patch; cada major sai em PR próprio, para revisar com calma.
# Alertas de segurança continuam saindo em PRs separados.
version: 2
updates:
  # Back-end: uv.lock
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    # Espera a versão nova ter alguns dias de vida antes de propor (pacote comprometido costuma ser retirado antes).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Front-end: pnpm-lock.yaml
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TS 7 (reescrita em Go) quebra o ESLint: o typescript-eslint só suporta TS < 6.1.
      # Remover quando o typescript-eslint suportar o TS 7 e atualizar os dois juntos.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Actions do CI (fixadas por SHA)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Imagens do compose.yaml (Postgres, Keycloak, LGTM). Dockerfiles entram na M0.9.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Versão major do Postgres exige migração dos dados (pg_upgrade/dump); é decisão manual.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      imagens:
        patterns: ["*"]
        update-types: ["minor", "patch"]
