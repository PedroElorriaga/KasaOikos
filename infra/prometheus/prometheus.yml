# Métricas da API chegam via OTLP (Collector) e as do k6 via remote write;
# os scrapes abaixo cobrem a saúde dos próprios componentes da stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    # OTLP e remote write podem entregar amostras fora de ordem.
    out_of_order_time_window: 30m

otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.instance.id
    - deployment.environment.name

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: keycloak
    static_configs:
      - targets: ["keycloak:9000"]
