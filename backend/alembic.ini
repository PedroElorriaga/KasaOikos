# Configuração do Alembic (migrations do banco da API).
# A URL do banco NÃO fica aqui: o env.py lê `DATABASE_URL` (variável de ambiente ou `.env`),
# a mesma da API. Rodar a partir de `backend/` ou via `just migrate`.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# Arquivos nomeados pelo id da revisão, que é escolhido à mão em sequência:
#   alembic revision --rev-id 0002 -m "descricao curta"
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
