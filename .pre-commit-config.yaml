# Hooks locais. Instalar uma vez por clone: `pre-commit install`.
# O repositório é público: o gitleaks barra o commit se encontrar segredo nos arquivos em stage.
# Os hooks de lint só verificam (não alteram arquivos); para corrigir, rode `just fmt`.
# Ruff, ESLint e Prettier rodam pelo uv/pnpm do projeto, nas versões dos lockfiles.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --directory backend --locked ruff check .
        language: system
        files: ^backend/
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check (backend)
        entry: uv run --directory backend --locked ruff format --check .
        language: system
        files: ^backend/
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: pnpm --dir frontend lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: prettier
        name: prettier --check (frontend)
        entry: pnpm --dir frontend format:check
        language: system
        files: ^frontend/
        pass_filenames: false
